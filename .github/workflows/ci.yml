name: CI

on:
  pull_request:
  push:
    branches:
      - claude/youth-athlete-mindset-app-lTPEP

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Type-check and build
        run: npm run build
