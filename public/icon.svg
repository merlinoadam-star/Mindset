<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   style="stop-color:#fbbf24"/>
      <stop offset="55%"  style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   style="stop-color:#fef9c3"/>
      <stop offset="60%"  style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="65%" r="35%">
      <stop offset="0%"   style="stop-color:#fff7ed; stop-opacity:0.95"/>
      <stop offset="60%"  style="stop-color:#fde68a; stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#fde68a; stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   style="stop-color:#f59e0b; stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#f59e0b; stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="220" r="180" fill="url(#halo)"/>

  <!-- Outer flame — sharp point top, two side tongues -->
  <path d="
    M 256 50
    C 234 110, 218 162, 232 215
    C 210 195, 195 170, 188 142
    C 156 192, 140 252, 162 312
    C 144 296, 132 270, 132 242
    C 100 300, 110 372, 168 414
    C 196 434, 226 442, 256 442
    C 286 442, 316 434, 344 414
    C 402 372, 412 300, 380 242
    C 380 270, 368 296, 350 312
    C 372 252, 356 192, 324 142
    C 317 170, 302 195, 280 215
    C 294 162, 278 110, 256 50
    Z"
    fill="url(#flameOuter)"/>

  <!-- Inner flame -->
  <path d="
    M 256 140
    C 244 180, 232 215, 244 250
    C 226 235, 215 218, 212 198
    C 188 235, 184 285, 208 330
    C 230 372, 250 388, 256 388
    C 262 388, 282 372, 304 330
    C 328 285, 324 235, 300 198
    C 297 218, 286 235, 268 250
    C 280 215, 268 180, 256 140
    Z"
    fill="url(#flameInner)"/>

  <!-- Hot core -->
  <ellipse cx="256" cy="320" rx="48" ry="62" fill="url(#core)"/>

  <!-- FEARLESS wordmark — block letters, 32 wide × 40 tall each, 8px gap.
       Total width: 32*8 + 8*7 = 312. Centered: x = (512-312)/2 = 100.
       Y baseline: 462 (bottom = 502, 10px from icon edge).
       Hand-drawn so there's zero font dependency. -->
  <g fill="#fde68a">
    <!-- F at x=100 -->
    <g transform="translate(100,462)">
      <rect x="0" y="0"  width="8"  height="40" rx="1.5"/>
      <rect x="0" y="0"  width="32" height="8"  rx="1.5"/>
      <rect x="0" y="17" width="24" height="7"  rx="1.5"/>
    </g>
    <!-- E at x=140 -->
    <g transform="translate(140,462)">
      <rect x="0" y="0"  width="8"  height="40" rx="1.5"/>
      <rect x="0" y="0"  width="32" height="8"  rx="1.5"/>
      <rect x="0" y="17" width="24" height="7"  rx="1.5"/>
      <rect x="0" y="32" width="32" height="8"  rx="1.5"/>
    </g>
    <!-- A at x=180 — tapered triangle shape via path -->
    <g transform="translate(180,462)">
      <path d="M 0 40 L 12 0 L 20 0 L 32 40 L 22 40 L 19 30 L 13 30 L 10 40 Z"/>
      <rect x="13" y="22" width="6" height="6"/>
    </g>
    <!-- R at x=220 -->
    <g transform="translate(220,462)">
      <rect x="0" y="0" width="8" height="40" rx="1.5"/>
      <path d="M 8 0 L 22 0 Q 32 0 32 11 Q 32 19 24 21 L 32 40 L 22 40 L 16 22 L 8 22 Z M 12 8 L 22 8 Q 24 8 24 12 Q 24 16 22 16 L 12 16 Z"/>
    </g>
    <!-- L at x=260 -->
    <g transform="translate(260,462)">
      <rect x="0" y="0"  width="8"  height="40" rx="1.5"/>
      <rect x="0" y="32" width="28" height="8"  rx="1.5"/>
    </g>
    <!-- E at x=300 -->
    <g transform="translate(300,462)">
      <rect x="0" y="0"  width="8"  height="40" rx="1.5"/>
      <rect x="0" y="0"  width="32" height="8"  rx="1.5"/>
      <rect x="0" y="17" width="24" height="7"  rx="1.5"/>
      <rect x="0" y="32" width="32" height="8"  rx="1.5"/>
    </g>
    <!-- S at x=340 — blocky 5-bar S -->
    <g transform="translate(340,462)">
      <rect x="0"  y="0"  width="32" height="8" rx="1.5"/>
      <rect x="0"  y="8"  width="8"  height="11"/>
      <rect x="0"  y="17" width="32" height="7" rx="1.5"/>
      <rect x="24" y="22" width="8"  height="11"/>
      <rect x="0"  y="32" width="32" height="8" rx="1.5"/>
    </g>
    <!-- S at x=380 -->
    <g transform="translate(380,462)">
      <rect x="0"  y="0"  width="32" height="8" rx="1.5"/>
      <rect x="0"  y="8"  width="8"  height="11"/>
      <rect x="0"  y="17" width="32" height="7" rx="1.5"/>
      <rect x="24" y="22" width="8"  height="11"/>
      <rect x="0"  y="32" width="32" height="8" rx="1.5"/>
    </g>
  </g>
</svg>
